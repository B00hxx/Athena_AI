name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  backend:
    name: Backend · unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image (CPU PyTorch)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: test
          tags: athenaai-backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run pytest
        run: >
          docker run --rm athenaai-backend:test
          python -m pytest backend/tests -p no:cacheprovider --cov=backend --cov-report=term-missing:skip-covered

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        env:
          DB_PASSWORD: ci
          SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
      - name: Build the frontend image
        run: docker build -t athenaai-frontend .
