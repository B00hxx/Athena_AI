[pytest]
# Run from the project root (or /app in the container):  python -m pytest backend/tests
testpaths = tests
pythonpath = ..
addopts = -ra --strict-markers
markers =
    e2e: end-to-end tests against a running stack (set ATHENA_E2E_URL to enable)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
