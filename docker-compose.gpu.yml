# NVIDIA GPU override (requires the NVIDIA Container Toolkit):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# Runs the LLM and Marker's PDF models on the GPU, which is many times faster than CPU.
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  ollama:
    <<: *gpu

  backend:
    <<: *gpu
    environment:
      # Unload the LLM while Marker parses a PDF so both don't compete for VRAM.
      # Set to false on GPUs with enough memory for both (roughly 12 GB+).
      FREE_GPU_FOR_INGESTION: ${FREE_GPU_FOR_INGESTION:-true}
    build:
      args:
        TORCH_VARIANT: cu128
    image: athenaai-backend:gpu
